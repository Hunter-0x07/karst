[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karst-core"
version = "0.0.2"
description = "Evidence-first security research core: HTTP bootstrap slice"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
karst = "karst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
