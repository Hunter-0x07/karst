[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karst-core"
version = "0.0.4"
description = "Evidence-first HTTP research with independent object-read verification"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
karst = "karst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
karst = ["methods/*.json"]
